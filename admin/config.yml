backend:
  name: git-gateway
  branch: main

# After a save, Netlify runs `node build.js` (see netlify.toml): it regenerates
# index.html from content/site.json and work/*.html from content/cases/*.json.
publish_mode: simple

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: "site"
    label: "Home Page"
    editor:
      preview: false
    files:
      - file: "content/site.json"
        label: "Home page texts"
        name: "site"
        fields:
          - label: "Browser tab title & link preview title"
            name: "seoTitle"
            widget: "string"
          - label: "Search & link preview description"
            name: "seoDescription"
            widget: "text"
          - { label: "Link preview image — description (for accessibility)", name: "ogImageAlt", widget: "string" }

          - { label: "Hero — text bottom-left", name: "heroDescription", widget: "text" }
          - { label: "Hero — label bottom-right", name: "heroRole", widget: "string" }
          - label: "Hero — main photo"
            name: "heroImage"
            widget: "image"
            required: false
            hint: "Upload ONE wide photo, ideally 3440×1440 or larger (ratio about 2.4:1), JPG, PNG or WebP. After publishing, the site cuts it into all the sizes it needs (ultrawide, desktop, tablet, phone) by itself. Leave empty to keep the current photo."
          - label: "Hero — face position (% from the left edge)"
            name: "heroFocusX"
            widget: "number"
            value_type: "int"
            min: 0
            max: 100
            default: 52
            hint: "Where the face is horizontally, 0 = left edge, 100 = right edge. The tablet and phone pictures are cropped around this point. Check the phone view after changing the photo."

          - label: "Tags strip (the running line under the first screen)"
            name: "tags"
            widget: "list"
            summary: "{{fields.tag}}"
            field: { label: "Tag", name: "tag", widget: "string" }

          - label: "Selected Work — heading"
            name: "introHeading"
            widget: "string"
            hint: "The first, white part of the heading"
          - { label: "Selected Work — heading (orange part)", name: "introHeadingAccent", widget: "string" }
          - label: "Selected Work — paragraphs on the right"
            name: "introNote"
            widget: "list"
            summary: "{{fields.paragraph}}"
            field: { label: "Paragraph", name: "paragraph", widget: "text" }

          - label: "Selected Work — project list"
            name: "works"
            widget: "list"
            hint: "Drag the ≡ handle to change the order. This order is used on the home page AND for the 'More cases' block under every case."
            summary: "{{fields.title}}"
            fields:
              - { label: "Name in the list", name: "title", widget: "string" }
              - { label: "Category line (e.g. Insurance • UX/UI Design)", name: "category", widget: "string" }
              - { label: "Case page address (the case's URL slug, e.g. risk-calculation)", name: "caseSlug", widget: "string", pattern: ["^[a-z0-9-]+$", "Lowercase letters, numbers and dashes only"] }
              - { label: "Preview picture that appears on hover", name: "image", widget: "image" }

          - { label: "About — heading (orange first word)", name: "trustHeadingAccent", widget: "string" }
          - { label: "About — heading (rest)", name: "trustHeading", widget: "string" }
          - { label: "About — paragraph on the right", name: "trustNote", widget: "text" }

          - label: "Capability cards (slide in from the right)"
            name: "cards"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Card title", name: "title", widget: "string" }
              - label: "Bullet points"
                name: "items"
                widget: "list"
                summary: "{{fields.point}}"
                field: { label: "Point", name: "point", widget: "string" }

          - { label: "Experience — theme", name: "experienceTheme", widget: "select", options: [{ label: "Light", value: "light" }, { label: "Dark", value: "dark" }], default: "light" }
          - { label: "Experience — heading (first part)", name: "experienceHeading", widget: "string" }
          - { label: "Experience — heading (orange part)", name: "experienceHeadingAccent", widget: "string" }
          - { label: "Experience — small note next to the heading (e.g. 2018 — now)", name: "experienceNote", widget: "string" }
          - label: "Experience — jobs (newest first; drag to reorder)"
            name: "experience"
            widget: "list"
            summary: "{{fields.company}} — {{fields.role}}"
            fields:
              - { label: "Company", name: "company", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Start (year-month, e.g. 2025-07)", name: "start", widget: "string", pattern: ["^\\d{4}-\\d{2}$", "Use the form 2025-07"] }
              - { label: "End (year-month, e.g. 2025-04) — leave empty if it is your current job", name: "end", widget: "string", required: false, pattern: ["^(\\d{4}-\\d{2})?$", "Use the form 2025-04 or leave empty"] }
              - { label: "Place (optional, e.g. Remote)", name: "place", widget: "string", required: false }
              - { label: "Work format (optional, e.g. Part-time, NDA project)", name: "format", widget: "string", required: false }
              - { label: "Small line above the company (optional, e.g. Where I am now)", name: "kicker", widget: "string", required: false }
              - { label: "Big word in the left column (optional — by default Now for the current job, otherwise the start year)", name: "word", widget: "string", required: false }
              - { label: "Summary", name: "summary", widget: "text" }
              - { label: "Label above the chips (optional, e.g. Modules I designed)", name: "chipsLabel", widget: "string", required: false }
              - label: "Chips (optional)"
                name: "chips"
                widget: "list"
                required: false
                field: { label: "Chip", name: "chip", widget: "string" }
              - label: "What I did"
                name: "bullets"
                widget: "list"
                summary: "{{fields.bullet}}"
                field: { label: "Point", name: "bullet", widget: "text" }
              - label: "Tags (optional)"
                name: "tags"
                widget: "list"
                required: false
                field: { label: "Tag", name: "tag", widget: "string" }
              - { label: "Link to a case study (optional — the case's URL slug, e.g. time2pack)", name: "caseSlug", widget: "string", required: false }
          - { label: "Experience — education label", name: "experienceEducationLabel", widget: "string", required: false }
          - { label: "Experience — education line", name: "experienceEducation", widget: "text", required: false }

          - { label: "FAQ — heading", name: "faqTitle", widget: "string" }
          - label: "FAQ — questions (the first one is open by default)"
            name: "faq"
            widget: "list"
            summary: "{{fields.question}}"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }

          - { label: "Footer — heading, line 1", name: "footerHeadingLine1", widget: "string" }
          - { label: "Footer — heading, line 2", name: "footerHeadingLine2", widget: "string" }
          - { label: "Footer — button text", name: "footerButton", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "LinkedIn URL", name: "linkedin", widget: "string" }
          - { label: "Instagram URL", name: "instagram", widget: "string" }

  - name: "cases"
    label: "Case Studies"
    editor:
      preview: false
    folder: "content/cases"
    extension: "json"
    format: "json"
    create: true
    slug: "{{fields.slug}}"
    summary: "{{title}}"
    identifier_field: "title"
    fields:
      - { label: "URL slug (letters, numbers, dashes only — e.g. risk-calculation)", name: "slug", widget: "string", pattern: ["^[a-z0-9-]+$", "Lowercase letters, numbers and dashes only"] }
      - { label: "Category tag (e.g. Insurance · UX/UI Design)", name: "category", widget: "string" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Homepage card summary (short, shown on the Work grid)", name: "cardSummary", widget: "text" }
      - { label: "Case intro (shown at the top of the case study page)", name: "sub", widget: "text" }
      - label: "Role tags (small pills under the intro)"
        name: "meta"
        widget: "list"
        field: { label: "Tag", name: "tag", widget: "string" }
      - label: "Key facts strip under the intro (optional — e.g. Client / Role / Platform / Period)"
        name: "facts"
        widget: "list"
        required: false
        summary: "{{fields.label}}: {{fields.value}}"
        fields:
          - { label: "Label (e.g. Client)", name: "label", widget: "string" }
          - { label: "Value (e.g. Confidential, NDA)", name: "value", widget: "string" }
      - { label: "Page theme under the cover", name: "theme", widget: "select", options: [{ label: "Dark", value: "dark" }, { label: "Light", value: "light" }], default: "dark", required: false }
      - { label: "Accent colour of the case (optional — e.g. #ff5800)", name: "accent", widget: "color", required: false, allowInput: true }
      - label: "Cover image"
        name: "cover"
        widget: "object"
        fields:
          - { label: "Image", name: "image", widget: "image" }
          - { label: "Alt text (describe the image for accessibility)", name: "alt", widget: "string" }
      - label: "Body sections"
        name: "sections"
        widget: "list"
        summary: "{{fields.heading}}"
        fields:
          - { label: "Heading (small label above the headline; used on its own in the old layout)", name: "heading", widget: "string" }
          - { label: "Headline — one big sentence (optional; when filled, the section uses the new layout)", name: "headline", widget: "string", required: false }
          - label: "Numbered cards (optional — steps, decisions, parts)"
            name: "steps"
            widget: "list"
            required: false
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string", required: false }
              - { label: "Short text", name: "text", widget: "text", required: false }
          - label: "Paragraphs"
            name: "paragraphs"
            widget: "list"
            field: { label: "Paragraph", name: "paragraph", widget: "text" }
          - label: "Bullet list (optional)"
            name: "list"
            widget: "list"
            required: false
            field: { label: "Item", name: "item", widget: "string" }
          - label: "Pictures under this section (optional — each row is shown side by side, all the same height)"
            name: "shots"
            widget: "list"
            required: false
            summary: "Row of {{fields.images.length}} picture(s)"
            fields:
              - label: "Pictures in this row (best 1–5; drag to reorder)"
                name: "images"
                widget: "list"
                field: { label: "Image", name: "image", widget: "image" }
              - { label: "Max height of this row in px (optional — default 640; use 900–1000 for big wide boards)", name: "height", widget: "number", value_type: "int", min: 200, max: 1200, required: false }
      - label: "Gallery images (optional)"
        name: "gallery"
        widget: "list"
        required: false
        field: { label: "Image", name: "image", widget: "image" }
      - { label: "Result / outcome (optional — leave blank to hide this block)", name: "result", widget: "text", required: false }
      - label: "What I designed (optional closing block)"
        name: "designed"
        widget: "object"
        required: false
        fields:
          - { label: "Label", name: "label", widget: "string", required: false }
          - label: "Tags"
            name: "tags"
            widget: "list"
            required: false
            field: { label: "Tag", name: "tag", widget: "string" }
          - { label: "Text", name: "text", widget: "text", required: false }
